name: Build COLORVERSE Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build & Verify Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36 & Build Tools 36.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Run unit tests (8/8)
        run: npx tsx --test src/engine/coloringLogic.test.ts src/data/catalog.test.ts

      - name: Build production web bundle
        run: npm run build

      - name: Sync web bundle to Android project
        run: npx cap sync android

      - name: Ensure Android release signing keystore is available
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          COLORVERSE_KEYSTORE_PASSWORD: ${{ secrets.COLORVERSE_KEYSTORE_PASSWORD }}
          COLORVERSE_KEY_PASSWORD: ${{ secrets.COLORVERSE_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/colorverse-release.keystore
          elif [ ! -f android/colorverse-release.keystore ]; then
            STORE_PASS="${COLORVERSE_KEYSTORE_PASSWORD:-ColorverseRelease2026!}"
            KEY_PASS="${COLORVERSE_KEY_PASSWORD:-ColorverseRelease2026!}"
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore android/colorverse-release.keystore \
              -alias colorverse \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=COLORVERSE, OU=Studio, O=COLORVERSE, L=Global, S=Global, C=US"
          fi

      - name: Build Release and Debug APKs with Gradle
        working-directory: android
        env:
          COLORVERSE_KEYSTORE_PASSWORD: ${{ secrets.COLORVERSE_KEYSTORE_PASSWORD }}
          COLORVERSE_KEY_PASSWORD: ${{ secrets.COLORVERSE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Verify APK integrity and signatures
        run: |
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$RELEASE_APK"
          test -s "$DEBUG_APK"

          ls -lh "$RELEASE_APK" "$DEBUG_APK"
          unzip -tq "$RELEASE_APK"
          unzip -tq "$DEBUG_APK"

          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$RELEASE_APK"
          "$APKSIGNER" verify --verbose "$DEBUG_APK"

          mkdir -p ci-artifacts
          cp "$RELEASE_APK" ci-artifacts/COLORVERSE-v1.0.0-release.apk
          cp "$DEBUG_APK" ci-artifacts/COLORVERSE-v1.0.0-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: COLORVERSE-v1.0.0-release-apk
          path: ci-artifacts/COLORVERSE-v1.0.0-release.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: COLORVERSE-v1.0.0-debug-apk
          path: ci-artifacts/COLORVERSE-v1.0.0-debug.apk
          retention-days: 90
          if-no-files-found: error
